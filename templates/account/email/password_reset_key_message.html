<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Redefinição de Senha</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif; color: #333;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding: 20px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width: 600px; background-color: #ffffff; border-radius: 10px; padding: 20px;">
            <tr>
              <td align="center" style="padding-bottom: 20px;">
                <img src="https://upload.wikimedia.org/wikipedia/pt/f/f9/Furia_Esports_logo.png" alt="Logo FURIA" width="70" style="display: block;">
              </td>
            </tr>
            <tr>
              <td>
                <h2 style="color: #111111;">Redefinição de senha</h2>
                <p>Olá <strong>{{ user.get_username }}</strong>,</p>
                <p>Recebemos uma solicitação para redefinir sua senha.</p>
                <p>Se você fez essa solicitação, clique no botão abaixo para continuar:</p>
                <p style="text-align: center; margin: 30px 0;">
                  <a href="{{ password_reset_url }}" style="background-color: #16a34a; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 5px; display: inline-block;">
                    Redefinir senha
                  </a>
                </p>
                <p>Se você não fez essa solicitação, apenas ignore este e-mail.</p>
                <p style="margin-top: 40px;">Atenciosamente,<br><strong>Equipe FURIA</strong></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
